<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">TaleemGo AI</title>
  <desc id="d">TaleemGo AI. Your university LMS, on WhatsApp. English, Urdu and Sindhi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#10264a"/>
      <stop offset="1" stop-color="#0f5b63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>

  <!-- chat bubbles (abstract) -->
  <g transform="translate(868 58)">
    <rect x="0" y="0" width="300" height="74" rx="20" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22"/>
    <path d="M30 74 L18 96 L52 74 Z" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22" stroke-linejoin="round"/>
    <rect x="26" y="22" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="26" y="42" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.30"/>
  </g>
  <g transform="translate(940 166)">
    <rect x="0" y="0" width="300" height="86" rx="20" fill="url(#accent)" fill-opacity="0.92"/>
    <path d="M270 86 L284 108 L244 86 Z" fill="url(#accent)" fill-opacity="0.92"/>
    <rect x="26" y="24" width="210" height="10" rx="5" fill="#06222a" fill-opacity="0.80"/>
    <rect x="26" y="46" width="150" height="10" rx="5" fill="#06222a" fill-opacity="0.55"/>
    <rect x="26" y="66" width="90" height="8" rx="4" fill="#06222a" fill-opacity="0.35"/>
  </g>

  <!-- title -->
  <text x="72" y="148" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">TaleemGo <tspan fill="url(#accent)">AI</tspan></text>
  <text x="76" y="200" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#dbeafe">Your university LMS, on WhatsApp.</text>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e0f2fe">
    <rect x="76" y="236" width="104" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="128" y="261" text-anchor="middle">English</text>
    <rect x="192" y="236" width="86" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="235" y="261" text-anchor="middle">Urdu</text>
    <rect x="290" y="236" width="94" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="337" y="261" text-anchor="middle">Sindhi</text>
    <rect x="396" y="236" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="471" y="261" text-anchor="middle">Free to run</text>
  </g>
</svg>
